[package]
name = "texturecraft-ui-egui"
description = "TextureCraft's egui shell: docks, toolbars, viewports and windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
texturecraft-engine = { workspace = true }
texturecraft-render = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence"] }
egui = { workspace = true }
craft-ui = { workspace = true }
craft-i18n = { workspace = true }
craft-window = { workspace = true }
craft-keymap = { workspace = true }
craft-quit = { workspace = true }
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
base64 = "0.22"
image = { workspace = true }
zip = { workspace = true }

# The OS UI language for the first run (MIT OR Apache-2.0; the browser asks `navigator.language`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = "0.3"
# Floating panels open as OS windows.
craft-ui = { workspace = true, features = ["native-windows"] }
# Help > Check for Updates and the check at start (updates_ui.rs).
craft-update = { workspace = true }
# Native file dialogs (file_dialogs.rs); the browser build has none.
craft-dialogs = { workspace = true }
# Whether the app runs in a real window, where an eyedropper pick may take clicks outside it (screen_pick).
raw-window-handle = "0.6"

# An eyedropper click outside the window (screen_pick): a low-level mouse hook and the eyedropper as the system pointer
# (winsafe, MIT) and one desktop pixel through GDI (xcap, Apache-2.0).
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["gdi", "user"] }
xcap = { version = "0.9", default-features = false }

# The same on X11 (a pointer grab with the eyedropper pointer and one root-window pixel; x11rb, MIT OR Apache-2.0) and on Wayland (the desktop's colour
# picker portal; zbus, MIT).
[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
x11rb = { version = "0.13", features = ["render"] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

# build.rs: the interface faces lose their Private Use Area, where the icon font draws (the
# versions craft-libs' craft-fonts-build subsets with).
[build-dependencies]
craft-i18n = { workspace = true }
skera = "0.8"
skrifa = { version = "0.48", default-features = false, features = ["std"] }

# Browser file I/O (web_files.rs): async pickers and Blob downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "CssStyleDeclaration", "Navigator"] }

# winit needs a window system on Linux, so the crate's own tests build with X11.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
eframe = { workspace = true, features = ["x11"] }
# Offscreen pictures of the whole window (tests/ui_snapshots.rs).
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
# Fallible setup of the exact GPU device used by rendering regression tests.
pollster = "0.4"
image = { workspace = true }
